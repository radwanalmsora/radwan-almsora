<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevTools Pro v1.2</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 25px;
        }

        .tool-section {
            margin-bottom: 25px;
            background: rgba(15, 23, 42, 0.4);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        h3 {
            font-size: 16px;
            margin-top: 0;
            margin-bottom: 15px;
            color: var(--accent-color);
        }

        textarea, input {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 14px;
            box-sizing: border-box;
            resize: vertical;
            margin-bottom: 12px;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus, input:focus {
            border-color: var(--accent-color);
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 10px 15px;
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        .output-box {
            background: #0f172a;
            padding: 12px;
            border-radius: 8px;
            border: 1px dashed var(--border-color);
            word-break: break-all;
            font-family: monospace;
            font-size: 13px;
            color: var(--text-muted);
            min-height: 20px;
        }

        .footer {
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 20px;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🔥 DevTools Pro</h1>
        <p class="subtitle">Modern & Fast Developer Utilities</p>

        <!-- Base64 Tool -->
        <div class="tool-section">
            <h3>Base64 Encoder / Decoder</h3>
            <textarea id="base64Input" placeholder="Enter text to encode or decode..."></textarea>
            <div class="btn-group">
                <button onclick="encodeBase64()">Encode</button>
                <button onclick="decodeBase64()">Decode</button>
            </div>
        </div>

        <!-- SHA-256 Tool -->
        <div class="tool-section">
            <h3>SHA-256 Hash Generator</h3>
            <input type="text" id="hashInput" placeholder="Enter text for hashing..." oninput="generateHash()">
            <div class="output-box" id="hashOutput">Hash result will appear here...</div>
        </div>

        <div class="footer">
            Built with precision • DevTools Pro
        </div>
    </div>

    <script>
        function encodeBase64() {
            try {
                let val = document.getElementById('base64Input').value;
                document.getElementById('base64Input').value = btoa(unescape(encodeURIComponent(val)));
            } catch (e) {
                alert('Encoding error!');
            }
        }

        function decodeBase64() {
            try {
                let val = document.getElementById('base64Input').value;
                document.getElementById('base64Input').value = decodeURIComponent(escape(atob(val)));
            } catch (e) {
                alert('Invalid Base64 string!');
            }
        }

        async function generateHash() {
            const text = document.getElementById('hashInput').value;
            const outputBox = document.getElementById('hashOutput');
            
            if (!text) {
                outputBox.innerText = "Hash result will appear here...";
                return;
            }

            const encoder = new TextEncoder();
            const data = encoder.encode(text);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            
            outputBox.innerText = hashHex;
        }
    </script>
</body>
</html>
